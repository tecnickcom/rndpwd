name: check

permissions: read-all

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

env:
  # Go version whose test run publishes the coverage report.
  COVERAGE_GO_VERSION: '1.27.x'

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Latest patch release of each supported Go minor version.
        go: ['1.27.x']
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: setup go build environment
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - name: linter
        run: make mod deps linter govulncheck GOPATH=$(go env GOPATH)
      - name: go.mod and go.sum are tidy
        run: make modcheck GOPATH=$(go env GOPATH)

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.27.x']
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: setup go build environment
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - name: unit tests
        run: make mod deps confcheck test GOPATH=$(go env GOPATH)
      - name: coverage report
        if: matrix.go == env.COVERAGE_GO_VERSION
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          file: target/report/coverage.out
          format: golang

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: setup go build environment
        uses: actions/setup-go@v7
        with:
          # Matches the base image in resources/docker/Dockerfile.dev, which
          # compiles the container build.
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: set RELEASE number
        run: echo ${GITHUB_RUN_NUMBER} > RELEASE
      - name: integration tests
        run: make mod deps generate build docker dockertest GOPATH=$(go env GOPATH)
